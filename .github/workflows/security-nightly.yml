name: Nightly image re-scan

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  rescan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the deployed image
        run: |
          IMAGE="$(yq '.${{ matrix.component }}.image.repository + ":" + .${{ matrix.component }}.image.tag' gitops/environments/dev/values.yaml)"
          case "$IMAGE" in *:) echo "nothing deployed yet"; echo "SKIP=true" >> "$GITHUB_ENV" ;; esac
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.SKIP != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: env.SKIP != 'true'
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: security/.trivyignore
