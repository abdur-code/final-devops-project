nameOverride: ""
fullnameOverride: ""

environment: dev
imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/abdur-code/stockpilot-backend
    tag: ""  # commit SHA, required
    pullPolicy: IfNotPresent
  replicaCount: 2  # ignored when hpa.enabled
  port: 8000
  logLevel: INFO
  enableLoadEndpoint: false
  runMigrations: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  probes:
    liveness:  { path: /health, initialDelaySeconds: 5,  periodSeconds: 15, failureThreshold: 3 }
    readiness: { path: /ready,  initialDelaySeconds: 5,  periodSeconds: 10, failureThreshold: 3 }
    startup:   { path: /health, periodSeconds: 2, failureThreshold: 30 }

frontend:
  image:
    repository: ghcr.io/abdur-code/stockpilot-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgres:
  enabled: true
  image: postgres:17-alpine
  database: stockpilot
  username: stockpilot
  password: ""
  existingSecret: ""  # needs keys DB_USER and DB_PASSWORD
  storage:
    size: 2Gi
    storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

service:
  type: ClusterIP

ingress:
  enabled: false
  className: nginx
  host: stockpilot.local
  annotations: {}
  tls:
    enabled: false
    secretName: stockpilot-tls

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
  dashboard:
    enabled: true
