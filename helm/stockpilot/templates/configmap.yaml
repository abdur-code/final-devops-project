apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.fullname" . }}-config
  labels: {{- include "stockpilot.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.backend.logLevel | quote }}
  DB_HOST: {{ include "stockpilot.fullname" . }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  ENABLE_LOAD_ENDPOINT: {{ .Values.backend.enableLoadEndpoint | quote }}
