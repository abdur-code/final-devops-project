apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stockpilot.fullname" . }}-test
  labels: {{- include "stockpilot.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: wget
      image: busybox:1.37
      command: ["sh", "-c", "wget -qO- http://{{ include "stockpilot.fullname" . }}-backend:{{ .Values.backend.port }}/ready && wget -qO- http://{{ include "stockpilot.fullname" . }}-frontend/healthz"]
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
