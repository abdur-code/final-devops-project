{{- if and .Values.networkPolicy.enabled .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stockpilot.fullname" . }}-postgres
  labels: {{- include "stockpilot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "stockpilot.selector" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "stockpilot.selector" (dict "ctx" . "component" "backend") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
