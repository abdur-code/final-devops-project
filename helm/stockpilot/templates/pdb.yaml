{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "stockpilot.fullname" . }}-backend
  labels: {{- include "stockpilot.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "stockpilot.selector" (dict "ctx" . "component" "backend") | nindent 6 }}
{{- end }}
