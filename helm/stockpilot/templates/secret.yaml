{{- if not .Values.postgres.existingSecret }}
{{- $pw := required "Set postgres.password (e.g. --set postgres.password=$(openssl rand -hex 16)) or postgres.existingSecret" .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockpilot.dbSecretName" . }}
  labels: {{- include "stockpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.postgres.username | quote }}
  DB_PASSWORD: {{ $pw | quote }}
{{- end }}
