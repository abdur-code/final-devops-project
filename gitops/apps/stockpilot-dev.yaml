apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpilot-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stockpilot
  sources:
    - repoURL: https://github.com/abdur-code/final-devops-project.git
      targetRevision: main
      path: helm/stockpilot
      helm:
        releaseName: stockpilot
        valueFiles:
          - values.yaml
          - $values/gitops/environments/dev/values.yaml
    - repoURL: https://github.com/abdur-code/final-devops-project.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: stockpilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
