apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stockpilot-raw
labels:
  - pairs: {app.kubernetes.io/part-of: stockpilot}
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml
secretGenerator:
  - name: stockpilot-db
    envs: [db.env]
    options:
      disableNameSuffixHash: true
images:
  - name: ghcr.io/abdur-code/stockpilot-backend
    newTag: "acd7c480f23d5873f215bf16fdfca7baa9d60b48"
  - name: ghcr.io/abdur-code/stockpilot-frontend
    newTag: "acd7c480f23d5873f215bf16fdfca7baa9d60b48"
